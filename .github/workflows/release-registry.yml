name: Build, Release, and Deploy Registry


on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Community Repo
        uses: actions/checkout@v4

      - name: Setup Babashka
        uses: turtlequeue/setup-babashka@v1.7.0
        with:
          babashka-version: '1.3.190'

      - name: Fetch and Aggregate Modules
        env:
          CDN_BASE: "https://paradise-chat.github.io/community-repo"
        run: bb scripts/aggregate.clj

      - name: Bundle Release Asset
        run: |
          mkdir -p dist
          tar -czvf dist/paradise-registry-bundle.tar.gz -C public .

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="v$(date +%s)"
          gh release create $RELEASE_TAG dist/paradise-registry-bundle.tar.gz --title "Registry Update $RELEASE_TAG" --notes "Automated registry build"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
